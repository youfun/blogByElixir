# fly.toml app configuration file generated for blogfun on 2024-04-11T23:44:49+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "blogfun"
primary_region = "hkg"
kill_signal = "SIGTERM"
swap_size_mb = 512
kill_timeout = "5s"


[experimental]
  auto_rollback = true

[deploy]
  release_command = "/app/bin/migrate"

[env]
  BUCKET_MOUNT = "/tigris"
  BUMBLEBEE_CACHE_DIR = "/app/.bumblebee"
  PHX_HOST = "livebeats.fly.dev"

[[services]]
  protocol = "tcp"
  internal_port = 4000
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 2500
    soft_limit = 2000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    restart_limit = 0